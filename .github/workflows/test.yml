name: Test
on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [master]

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    services:
      docker:
        image: docker:20.10.8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true
      - name: Install dependencies
        run: go mod download
      - name: Go unit tests
        run: |
          # Unit tests need a network interface; GitHub disallows that directly,
          # so run them inside a Go container matching go.mod's toolchain.
          docker run --rm \
          -v ${{ github.workspace }}:/workspace \
          -v ${{ github.workspace }}/go/pkg/mod:/go/pkg/mod \
          -w /workspace \
          golang:$(go list -m -f '{{.GoVersion}}') \
          /bin/sh -c "go mod download && go test ./..."

  filter-race:
    name: Filter race detector
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true
      - name: Install dependencies
        run: go mod download
      - name: Run filter tests under the race detector
        run: go test -race -count=1 ./filter

  filter-compat:
    name: Filter tcpdump golden compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true
      - name: Install dependencies
        run: go mod download
      - name: Compare against checked-in tcpdump golden programs
        run: go test -count=1 ./filter -run '^TestTCPDumpGoldenDecisionEquivalence$'
